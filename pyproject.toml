[project]
name = "skinrisk-fusion"
version = "0.1.0"
description = "Multimodal Skin Lesion Risk Classification on ISIC 2024"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "h5py>=3.9.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "pytest>=7.4.0",
    "joblib>=1.3.0",
    "streamlit>=1.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

